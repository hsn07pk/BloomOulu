server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Charset for text responses
    charset utf-8;

    # Sane logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Compression for text-ish files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        text/jsx;

    # Default routing — try the requested URI, then with a trailing slash, then 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Plant images & decorative assets — long cache
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Audio narrations — long cache + force audio/mp4 MIME for .m4a
    location ~* \.m4a$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        default_type audio/mp4;
        try_files $uri =404;
    }

    # JSX files — must not be cached aggressively during iteration
    location ~* \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # HTML — never aggressively cached
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Friendlier 404 — fall through to the redirect index page
    error_page 404 = @fallback;
    location @fallback {
        try_files /index.html =404;
    }
}
