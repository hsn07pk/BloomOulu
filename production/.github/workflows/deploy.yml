name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/admin.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/admin:${{ github.sha }}

  deploy-vps:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: SSH and pull new images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bloomoulu
            git pull --ff-only
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose --profile bootstrap up -d
            docker compose exec -T api pnpm --filter @bloomoulu/db run migrate:deploy
            docker compose ps
