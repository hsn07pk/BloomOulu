global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bloomoulu-api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: /metrics

  - job_name: 'bloomoulu-web'
    static_configs:
      - targets: ['web:3000']
    metrics_path: /api/metrics

  - job_name: 'bloomoulu-admin'
    static_configs:
      - targets: ['admin:4100']
    metrics_path: /admin/metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # We push alerts to ntfy directly from rules using webhook receiver
