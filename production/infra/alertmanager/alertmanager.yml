# Alertmanager → ntfy.sh routing.
#
# Three topics, each with a different ntfy priority:
#   bloomoulu-p0  → urgent  (wakes phones)
#   bloomoulu-p1  → high    (acknowledge by close of business)
#   bloomoulu-p2  → default (weekly review)
#
# Prometheus rules in `alerts.yml` set `labels.tier: P0|P1|P2` — that's the
# routing key. We don't use ntfy access tokens in dev; production deploys
# set NTFY_TOKEN via Doppler and Caddy enforces the topic-write ACL.

global:
  resolve_timeout: 5m
  # ntfy URLs come from env at container-start.
  http_config: {}

route:
  receiver: 'p2'
  group_by: ['alertname', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [ tier="P0" ]
      receiver: 'p0'
      group_wait: 0s              # page immediately
      repeat_interval: 30m
      continue: true
    - matchers: [ tier="P1" ]
      receiver: 'p1'
      group_wait: 30s
      repeat_interval: 1h
      continue: true

receivers:
  - name: 'p0'
    webhook_configs:
      - url: '${NTFY_BASE_URL}/${NTFY_TOPIC_P0}'
        send_resolved: true
        http_config:
          # ntfy.sh accepts the title/priority/tags as ordinary HTTP headers
          # but Alertmanager doesn't render them per-alert — we set static
          # values in `headers` and let the body carry the rendered alert.
          authorization:
            type: Bearer
            credentials: '${NTFY_TOKEN}'

  - name: 'p1'
    webhook_configs:
      - url: '${NTFY_BASE_URL}/${NTFY_TOPIC_P1}'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: '${NTFY_TOKEN}'

  - name: 'p2'
    webhook_configs:
      - url: '${NTFY_BASE_URL}/${NTFY_TOPIC_P2}'
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials: '${NTFY_TOKEN}'

inhibit_rules:
  # If the API is fully down, don't separately page for high latency / queue
  # depth / etc. — they're all symptoms of the same root cause.
  - source_matchers: [ alertname="ApiDown" ]
    target_matchers: [ tier="P1" ]
    equal: [ 'job' ]
