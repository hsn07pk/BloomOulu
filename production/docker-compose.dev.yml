# Slim dev stack — only Postgres + Redis + MinIO + MailHog + Ollama.
# Run `pnpm dev` on the host for hot-reload of web/api/admin/kiosk.

name: bloomoulu-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloomoulu
      POSTGRES_PASSWORD: bloomoulu
      POSTGRES_DB: bloomoulu
    ports: ['5432:5432']
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: [dev_redis_data:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [dev_minio_data:/data]

  mailhog:
    image: mailhog/mailhog
    ports: ['1025:1025', '8025:8025']

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ['11434:11434']
    volumes: [dev_ollama_data:/root/.ollama]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "8080"]
    ports: ['8080:8080']
    volumes: [dev_reranker_data:/data]

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_minio_data:
  dev_ollama_data:
  dev_reranker_data:
