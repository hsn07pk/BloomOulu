# ──────────────────────────────────────────────────────────────────────────
# BloomOulu — unified Docker Compose stack.
#
#   docker compose up -d
#
# That's it. One command brings up the full platform: Postgres + pgvector,
# Redis, the API, the web
# app, the admin panel, the kiosk, the reranker, the LGTM observability
# stack, and Caddy as the local reverse proxy.
#
# Configuration is driven entirely from .env (auto-loaded by Compose):
#   • SMTP_* — required to send mail. Gmail App Password example:
#       SMTP_HOST=smtp.gmail.com  SMTP_PORT=465  SMTP_SECURE=true
#       SMTP_USER=<you>@gmail.com  SMTP_PASS=<16-char-app-password>
#   • AUTH_OULU_OIDC_* — production SSO credentials. Empty = SSO disabled.
#   • PAYTRAIL_*, MOBILEPAY_* — payment provider credentials.
#
# The Ollama LLM runs natively on the macOS host (for Metal GPU access).
# The reranker (BAAI/bge-reranker-v2-m3) runs inside the cluster.
# Service ports are exposed for local dev convenience; in production they
# should be firewalled and only :80/:443 (Caddy) should be reachable.
# ──────────────────────────────────────────────────────────────────────────

name: bloomoulu

x-restart: &restart
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ── Reverse proxy (HTTP-only on localhost; swap Caddyfile for prod HTTPS) ──
  caddy:
    image: caddy:2.8-alpine
    <<: *restart
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile.localhost:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, admin, kiosk]
    networks: [internal]

  # ── App services ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}
        NEXT_PUBLIC_KIOSK_URL: ${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100}
        # Baked into routes-manifest.json by next build — must be the
        # in-Docker api hostname so the single-tunnel /v1/* + /webhooks/*
        # rewrites resolve. (Runtime env can't change it on standalone.)
        API_REWRITE_TARGET: http://api:4000
        # Proxy the AdminJS panel under the same host so one tunnel serves
        # the operator dashboard too. Also build-time-baked (see above).
        ADMIN_REWRITE_TARGET: http://admin:4100
        # Donor-facing contact details. Single source of truth: change in
        # one env var and every web page (donate/complete error, GDPR
        # banners, ask-the-garden curator name, etc.) reflects it.
        NEXT_PUBLIC_CURATOR_EMAIL: ${NEXT_PUBLIC_CURATOR_EMAIL:-curator@bloomoulu.fi}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-donate@bloomoulu.fi}
        NEXT_PUBLIC_GARDEN_NAME_EN: ${NEXT_PUBLIC_GARDEN_NAME_EN:-BloomOulu — University of Oulu Botanical Garden}
        NEXT_PUBLIC_GARDEN_NAME_FI: ${NEXT_PUBLIC_GARDEN_NAME_FI:-Oulun yliopiston kasvitieteellinen puutarha}
        NEXT_PUBLIC_GARDEN_NAME_SV: ${NEXT_PUBLIC_GARDEN_NAME_SV:-Uleåborgs universitets botaniska trädgård}
    <<: *restart
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}
      NEXT_PUBLIC_KIOSK_URL: ${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100}
      NEXT_PUBLIC_CURATOR_EMAIL: ${NEXT_PUBLIC_CURATOR_EMAIL:-curator@bloomoulu.fi}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-donate@bloomoulu.fi}
      NEXT_PUBLIC_GARDEN_NAME_EN: ${NEXT_PUBLIC_GARDEN_NAME_EN:-BloomOulu — University of Oulu Botanical Garden}
      NEXT_PUBLIC_GARDEN_NAME_FI: ${NEXT_PUBLIC_GARDEN_NAME_FI:-Oulun yliopiston kasvitieteellinen puutarha}
      NEXT_PUBLIC_GARDEN_NAME_SV: ${NEXT_PUBLIC_GARDEN_NAME_SV:-Uleåborgs universitets botaniska trädgård}
      INTERNAL_API_URL: http://api:4000
      # Same-origin rewrite target: web proxies /v1/* and /webhooks/* to
      # the api container so a single public hostname (the ngrok tunnel)
      # serves donor pages AND the payment webhooks/callbacks. See
      # apps/web/next.config.mjs rewrites().
      API_REWRITE_TARGET: http://api:4000
      AUTH_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_OULU_OIDC_ISSUER: ${AUTH_OULU_OIDC_ISSUER:-}
      AUTH_OULU_OIDC_CLIENT_ID: ${AUTH_OULU_OIDC_CLIENT_ID:-}
      AUTH_OULU_OIDC_CLIENT_SECRET: ${AUTH_OULU_OIDC_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      # Local-disk storage root for receipts, audio narrations, rehosted
      # plant images, GDPR exports, etc. Persisted via the api_storage
      # named volume so the data survives container rebuilds.
      STORAGE_DIR: /data/storage
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      ALLOWED_ORIGINS: "${NEXT_PUBLIC_WEB_URL:-http://localhost:3000},${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100},${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}"
      WEB_ORIGIN: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      # Ollama runs natively on host for Metal GPU; bridge from container.
      # We hardcode host.docker.internal here (instead of inheriting from
      # the host .env) because the host .env uses localhost — fine for
      # scripts run on the host, broken for processes inside a container.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      RERANKER_URL: http://reranker:8080
      # Real SMTP — pass these through from .env. The api throws on
      # send if SMTP_HOST is unset, so configure these before going
      # live. Gmail App Password example:
      #   SMTP_HOST=smtp.gmail.com  SMTP_PORT=465  SMTP_SECURE=true
      #   SMTP_USER=<you>@gmail.com  SMTP_PASS=<16-char-app-password>
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-BloomOulu <no-reply@bloomoulu.fi>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PAYTRAIL_MERCHANT_ID: ${PAYTRAIL_MERCHANT_ID:-375917}
      PAYTRAIL_SECRET: ${PAYTRAIL_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_API_URL: ${PAYTRAIL_API_URL:-https://services.paytrail.com}
      PAYTRAIL_WEBHOOK_SECRET: ${PAYTRAIL_WEBHOOK_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_CALLBACK_URL: ${PAYTRAIL_CALLBACK_URL:-http://localhost:4000/webhooks/paytrail}
      PAYTRAIL_RETURN_URL: ${PAYTRAIL_RETURN_URL:-http://localhost:3000/en/donate/complete}
      # Localhost runs Paytrail's signing pipeline against a locally-
      # hosted mock checkout (Paytrail itself rejects http:// callbacks).
      # In real deployment, unset / set to false and the live hosted
      # checkout at services.paytrail.com takes over with no code change.
      PAYTRAIL_MOCK: ${PAYTRAIL_MOCK:-true}
      MOBILEPAY_API_URL: ${MOBILEPAY_API_URL:-https://apitest.vipps.no}
      MOBILEPAY_CLIENT_ID: ${MOBILEPAY_CLIENT_ID:-}
      MOBILEPAY_CLIENT_SECRET: ${MOBILEPAY_CLIENT_SECRET:-}
      MOBILEPAY_SUBSCRIPTION_KEY: ${MOBILEPAY_SUBSCRIPTION_KEY:-}
      MOBILEPAY_MERCHANT_SERIAL_NUMBER: ${MOBILEPAY_MERCHANT_SERIAL_NUMBER:-}
      MOBILEPAY_WEBHOOK_SECRET: ${MOBILEPAY_WEBHOOK_SECRET:-}
      MOBILEPAY_RETURN_URL: ${MOBILEPAY_RETURN_URL:-${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}/en/donate/complete}
      MOBILEPAY_CALLBACK_URL: ${MOBILEPAY_CALLBACK_URL:-${NEXT_PUBLIC_API_URL:-http://localhost:4000}/webhooks/mobilepay}
      # ── BloomOulu garden identity (env-driven, .env-flip-to-prod) ─────
      # These are the runtime fallbacks for SystemSetting rows. Admin
      # edits in /admin → SystemSetting always win. Setting these here
      # means a brand-new deployment with NO admin writes still has the
      # right IBAN, contact emails, etc. The 21 Category-A values from
      # the hardcoded-audit live here.
      GARDEN_IBAN: ${GARDEN_IBAN:-FI00 0000 0000 0000 00}
      GARDEN_BIC: ${GARDEN_BIC:-NDEAFIHH}
      GARDEN_ORG_NAME: ${GARDEN_ORG_NAME:-Oulun yliopiston kasvitieteellinen puutarha}
      GARDEN_ORG_NAME_EN: ${GARDEN_ORG_NAME_EN:-BloomOulu — University of Oulu Botanical Garden}
      GARDEN_ORG_NAME_FI: ${GARDEN_ORG_NAME_FI:-Oulun yliopiston kasvitieteellinen puutarha}
      GARDEN_ORG_NAME_SV: ${GARDEN_ORG_NAME_SV:-Uleåborgs universitets botaniska trädgård}
      GARDEN_ORG_VAT_ID: ${GARDEN_ORG_VAT_ID:-FI02452579}
      GARDEN_ADDRESS: ${GARDEN_ADDRESS:-Linnanmaa, 90014 Oulun yliopisto}
      GARDEN_DONATE_URL: ${GARDEN_DONATE_URL:-${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}/en/donate/pay}
      # Contact details — used in receipts, error banners, ask-the-garden curator card.
      ASK_CURATOR_EMAIL: ${ASK_CURATOR_EMAIL:-curator@bloomoulu.fi}
      ASK_CURATOR_NAME: ${ASK_CURATOR_NAME:-Anna Liisa Ruotsalainen}
      ASK_CURATOR_REPLY_SLA_DAYS: ${ASK_CURATOR_REPLY_SLA_DAYS:-2}
      ASK_CONFIDENCE_THRESHOLD_BP: ${ASK_CONFIDENCE_THRESHOLD_BP:-1000}
      ASK_AUDIT_ERROR_TARGET: ${ASK_AUDIT_ERROR_TARGET:-0.05}
      ASK_OUT_OF_DOMAIN_BGCI: ${ASK_OUT_OF_DOMAIN_BGCI:-https://tools.bgci.org/plant_search.php}
      ASK_OUT_OF_DOMAIN_GBIF: ${ASK_OUT_OF_DOMAIN_GBIF:-https://www.gbif.org/species/search}
      ASK_OUT_OF_DOMAIN_PLANTNET: ${ASK_OUT_OF_DOMAIN_PLANTNET:-https://identify.plantnet.org/}
      WEBAPP_USER_AGENT_EMAIL: ${WEBAPP_USER_AGENT_EMAIL:-conservation@bloomoulu.fi}
      # Payment-provider feature flags (admin can also toggle).
      PAYMENTS_BANK_TRANSFER_ENABLED: ${PAYMENTS_BANK_TRANSFER_ENABLED:-true}
      PAYMENTS_PAYTRAIL_ENABLED: ${PAYMENTS_PAYTRAIL_ENABLED:-true}
      PAYMENTS_MOBILEPAY_ENABLED: ${PAYMENTS_MOBILEPAY_ENABLED:-false}
      # Shared HMAC secret protecting `/webhooks/bank-transfer`. When
      # unset (dev), the webhook still works but accepts only requests
      # WITHOUT an Authorization header (fail-closed). In prod this MUST
      # be set or the accountant's reconciliation cron is rejected.
      BANK_TRANSFER_WEBHOOK_SECRET: ${BANK_TRANSFER_WEBHOOK_SECRET:-}
      # Adoption flow knobs.
      ADOPTION_GIFT_WRAP_CENTS: ${ADOPTION_GIFT_WRAP_CENTS:-400}
      ADOPTION_DONATION_SHARE_BP: ${ADOPTION_DONATION_SHARE_BP:-7200}
      ADOPTION_PLAQUE_ELIGIBLE_TIERS: ${ADOPTION_PLAQUE_ELIGIBLE_TIERS:-endangered,corporate}
      ADOPTION_DEDICATION_MAX_CHARS: ${ADOPTION_DEDICATION_MAX_CHARS:-240}
      ADOPTION_CO_ADOPTER_MAX: ${ADOPTION_CO_ADOPTER_MAX:-10}
      ADOPTION_FUNDS_FLOW_URL: ${ADOPTION_FUNDS_FLOW_URL:-/about#funds-flow}
      # Production default: monthly + one_time only. Annual is hidden
      # until the admin enables it in /admin → SystemSetting →
      # adoption.intervalsEnabled (no deploy needed).
      ADOPTION_INTERVALS_ENABLED: ${ADOPTION_INTERVALS_ENABLED:-monthly,one_time}
      # VAT, receipts, GDPR retention.
      VAT_DONATION_RATE_BP: ${VAT_DONATION_RATE_BP:-0}
      VAT_PERK_RATE_BP: ${VAT_PERK_RATE_BP:-2400}
      RECEIPT_PREFIX: ${RECEIPT_PREFIX:-BLO}
      RECEIPT_YEAR_RESET: ${RECEIPT_YEAR_RESET:-true}
      GDPR_AUDIT_RETENTION_DAYS: ${GDPR_AUDIT_RETENTION_DAYS:-2190}
      GDPR_PSEUDONYMISE_AFTER_DAYS: ${GDPR_PSEUDONYMISE_AFTER_DAYS:-2190}
      KIOSK_DEFAULT_AMOUNT_CENTS: ${KIOSK_DEFAULT_AMOUNT_CENTS:-2500}
      # Tier pricing — seed reads these so admin starts with sensible
      # defaults; further edits are made in /admin → Tier.
      TIER_SEEDLING_ANNUAL_CENTS: ${TIER_SEEDLING_ANNUAL_CENTS:-2500}
      TIER_SEEDLING_MONTHLY_CENTS: ${TIER_SEEDLING_MONTHLY_CENTS:-300}
      TIER_ROOTED_ANNUAL_CENTS: ${TIER_ROOTED_ANNUAL_CENTS:-7500}
      TIER_ROOTED_MONTHLY_CENTS: ${TIER_ROOTED_MONTHLY_CENTS:-800}
      TIER_VULNERABLE_ANNUAL_CENTS: ${TIER_VULNERABLE_ANNUAL_CENTS:-25000}
      TIER_VULNERABLE_MONTHLY_CENTS: ${TIER_VULNERABLE_MONTHLY_CENTS:-2500}
      TIER_ENDANGERED_ANNUAL_CENTS: ${TIER_ENDANGERED_ANNUAL_CENTS:-75000}
      TIER_ENDANGERED_MONTHLY_CENTS: ${TIER_ENDANGERED_MONTHLY_CENTS:-7500}
      TIER_CORPORATE_ANNUAL_CENTS: ${TIER_CORPORATE_ANNUAL_CENTS:-250000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_storage:/data/storage
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthz"]
    networks: [internal]

  api-worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      JOBS_MODE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      # Worker shares the same local-disk storage volume as the api so
      # receipt PDFs, audio narrations, GDPR exports etc. land in the
      # same place.
      STORAGE_DIR: /data/storage
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
      EMAIL_FROM: ${EMAIL_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      # Payment env — dunning + renewal workers construct gateway
      # adapters here. Must mirror the `api` service's payment env so
      # background charges hit the same merchant. The defaults match
      # the api block so `docker compose up` works out of the box.
      PAYTRAIL_MERCHANT_ID: ${PAYTRAIL_MERCHANT_ID:-375917}
      PAYTRAIL_SECRET: ${PAYTRAIL_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_API_URL: ${PAYTRAIL_API_URL:-https://services.paytrail.com}
      PAYTRAIL_WEBHOOK_SECRET: ${PAYTRAIL_WEBHOOK_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_CALLBACK_URL: ${PAYTRAIL_CALLBACK_URL:-http://localhost:4000/webhooks/paytrail}
      PAYTRAIL_MOCK: ${PAYTRAIL_MOCK:-true}
      MOBILEPAY_API_URL: ${MOBILEPAY_API_URL:-https://apitest.vipps.no}
      MOBILEPAY_CLIENT_ID: ${MOBILEPAY_CLIENT_ID:-}
      MOBILEPAY_CLIENT_SECRET: ${MOBILEPAY_CLIENT_SECRET:-}
      MOBILEPAY_SUBSCRIPTION_KEY: ${MOBILEPAY_SUBSCRIPTION_KEY:-}
      MOBILEPAY_MERCHANT_SERIAL_NUMBER: ${MOBILEPAY_MERCHANT_SERIAL_NUMBER:-}
      MOBILEPAY_WEBHOOK_SECRET: ${MOBILEPAY_WEBHOOK_SECRET:-}
      MOBILEPAY_RETURN_URL: ${MOBILEPAY_RETURN_URL:-${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}/en/donate/complete}
      MOBILEPAY_CALLBACK_URL: ${MOBILEPAY_CALLBACK_URL:-${NEXT_PUBLIC_API_URL:-http://localhost:4000}/webhooks/mobilepay}
      GARDEN_IBAN: ${GARDEN_IBAN:-FI00 0000 0000 0000 00}
      GARDEN_BIC: ${GARDEN_BIC:-NDEAFIHH}
      GARDEN_ORG_NAME: ${GARDEN_ORG_NAME:-Oulun yliopiston kasvitieteellinen puutarha}
      GARDEN_DONATE_URL: ${GARDEN_DONATE_URL:-${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}/en/donate/pay}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      BANK_TRANSFER_WEBHOOK_SECRET: ${BANK_TRANSFER_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_storage:/data/storage
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "require('net').createConnection({host:'redis',port:6379}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
    networks: [internal]

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      api:      { condition: service_started }
    environment:
      # Stays "development" on localhost so the AdminJS session cookie
      # isn't marked Secure (plain http://localhost otherwise drops it).
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      # The /v1/* same-origin proxy in apps/admin/src/server.ts forwards
      # browser requests to the api. Inside the bloomoulu docker network
      # the api hostname is `api` (not `localhost`).
      API_URL: http://api:4000
      INTERNAL_API_URL: http://api:4000
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@admin.com}
      ADMIN_BOOTSTRAP_PASSWORD_HASH: ${ADMIN_BOOTSTRAP_PASSWORD_HASH}
      # Ollama for the admin RAG-doc ingest form. Hardcoded host bridge —
      # the host .env uses localhost (for host scripts), but inside a
      # container that resolves to the container itself.
      OLLAMA_URL: ${ADMIN_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${ADMIN_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: bge-m3
      EMBED_MODEL: bge-m3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ADMIN_PORT:-4100}:4100"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/admin/health"]
    networks: [internal]

  kiosk:
    build:
      context: .
      dockerfile: infra/docker/kiosk.Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      # Next.js standalone server reads PORT (defaults to 3000); set
      # it explicitly so the container listener matches the host port
      # mapping below. HOSTNAME=0.0.0.0 makes it reachable from outside.
      PORT: 3100
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${KIOSK_PORT:-3100}:3100"
    networks: [internal]

  # ── Stable public tunnel (ngrok) ───────────────────────────────────────
  # Gives the stack ONE fixed HTTPS URL (your reserved ngrok domain) so
  # payment-provider webhooks + redirects always hit the same place across
  # `docker compose up -d` restarts — the production-grade replacement for
  # the throwaway `trycloudflare.com` quick tunnel.
  #
  # Routes the single domain straight at the web container; web's Next.js
  # rewrites forward /v1/* and /webhooks/* to the api (see
  # apps/web/next.config.mjs + API_REWRITE_TARGET below), so one hostname
  # serves the whole donor + webhook flow.
  #
  # Lives in the `tunnel` compose profile so plain local dev doesn't need
  # ngrok. To make `docker compose up -d` include it automatically, set
  #   COMPOSE_PROFILES=tunnel
  # in your .env (alongside NGROK_AUTHTOKEN + NGROK_DOMAIN). One-time
  # setup is in docs/runbook/stable-tunnel.md.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [tunnel]
    <<: *restart
    command: http web:3000 --domain=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on: [web]
    networks: [internal]

  # ── Data plane ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bloomoulu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloomoulu}
      POSTGRES_DB:       ${POSTGRES_DB:-bloomoulu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks: [internal]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    networks: [internal]

  # ── ML / embeddings ────────────────────────────────────────────────────
  # The Ollama LLM lives on the macOS host (for Metal GPU). The reranker
  # runs in-cluster because BAAI/bge-reranker-v2-m3 is CPU-friendly.
  reranker:
    build:
      context: .
      dockerfile: infra/docker/reranker.Dockerfile
    <<: *restart
    environment:
      MODEL_ID: BAAI/bge-reranker-v2-m3
      MAX_LEN: "512"
      LOG_LEVEL: INFO
    volumes:
      - reranker_data:/data
    ports:
      - "${RERANKER_PORT:-8081}:8080"
    networks: [internal]

  # ── Observability (LGTM stack, minimal) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [alertmanager]
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:latest
    <<: *restart
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.localhost.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy | grep -q OK"]
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-bloomoulu}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [internal]

  loki:
    image: grafana/loki:latest
    <<: *restart
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:latest
    <<: *restart
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    networks: [internal]

  tempo:
    image: grafana/tempo:2.7.2
    <<: *restart
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3200/ready | grep -q ready"]
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}
  api_storage: {}
  reranker_data: {}
  alertmanager_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
