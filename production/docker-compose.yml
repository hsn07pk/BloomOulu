# ──────────────────────────────────────────────────────────────────────────
# BloomOulu — unified Docker Compose stack.
#
#   docker compose up -d
#
# That's it. One command brings up the full platform: Postgres + pgvector,
# Redis, MinIO, MailHog (or Gmail if .env points there), the API, the web
# app, the admin panel, the kiosk, the reranker, the LGTM observability
# stack, and Caddy as the local reverse proxy.
#
# Configuration is driven entirely from .env (auto-loaded by Compose):
#   • SMTP_* — defaults to MailHog. Set SMTP_HOST=smtp.gmail.com for Gmail.
#   • AUTH_OULU_OIDC_* — production SSO credentials. Empty = SSO disabled.
#   • PAYTRAIL_*, MOBILEPAY_* — payment provider credentials.
#
# The Ollama LLM runs natively on the macOS host (for Metal GPU access).
# The reranker (BAAI/bge-reranker-v2-m3) runs inside the cluster.
# Service ports are exposed for local dev convenience; in production they
# should be firewalled and only :80/:443 (Caddy) should be reachable.
# ──────────────────────────────────────────────────────────────────────────

name: bloomoulu

x-restart: &restart
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ── Reverse proxy (HTTP-only on localhost; swap Caddyfile for prod HTTPS) ──
  caddy:
    image: caddy:2.8-alpine
    <<: *restart
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile.localhost:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, admin, kiosk]
    networks: [internal]

  # ── App services ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}
        NEXT_PUBLIC_KIOSK_URL: ${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100}
    <<: *restart
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}
      NEXT_PUBLIC_KIOSK_URL: ${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100}
      INTERNAL_API_URL: http://api:4000
      AUTH_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_OULU_OIDC_ISSUER: ${AUTH_OULU_OIDC_ISSUER:-}
      AUTH_OULU_OIDC_CLIENT_ID: ${AUTH_OULU_OIDC_CLIENT_ID:-}
      AUTH_OULU_OIDC_CLIENT_SECRET: ${AUTH_OULU_OIDC_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_started }
      mailhog:  { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-eu-north-1}
      S3_BUCKET: ${S3_BUCKET:-bloomoulu-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: "${NEXT_PUBLIC_WEB_URL:-http://localhost:3000},${NEXT_PUBLIC_KIOSK_URL:-http://localhost:3100},${NEXT_PUBLIC_ADMIN_URL:-http://localhost:4100}"
      WEB_ORIGIN: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      # Ollama runs natively on host for Metal GPU; bridge from container
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      RERANKER_URL: http://reranker:8080
      # SMTP — defaults to MailHog. Set SMTP_HOST=smtp.gmail.com in .env
      # (plus SMTP_USER/PASS) to send via real Gmail instead.
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
      EMAIL_FROM: ${EMAIL_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PAYTRAIL_MERCHANT_ID: ${PAYTRAIL_MERCHANT_ID:-375917}
      PAYTRAIL_SECRET: ${PAYTRAIL_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_API_URL: ${PAYTRAIL_API_URL:-https://services.paytrail.com}
      PAYTRAIL_WEBHOOK_SECRET: ${PAYTRAIL_WEBHOOK_SECRET:-SAIPPUAKAUPPIAS}
      PAYTRAIL_CALLBACK_URL: ${PAYTRAIL_CALLBACK_URL:-http://localhost:4000/webhooks/paytrail}
      PAYTRAIL_RETURN_URL: ${PAYTRAIL_RETURN_URL:-http://localhost:3000/en/donate/complete}
      MOBILEPAY_API_URL: ${MOBILEPAY_API_URL:-https://apitest.vipps.no}
      MOBILEPAY_CLIENT_ID: ${MOBILEPAY_CLIENT_ID:-}
      MOBILEPAY_CLIENT_SECRET: ${MOBILEPAY_CLIENT_SECRET:-}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthz"]
    networks: [internal]

  api-worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      mailhog:  { condition: service_started }
    environment:
      NODE_ENV: production
      JOBS_MODE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
      EMAIL_FROM: ${EMAIL_FROM:-BloomOulu <noreply@bloomoulu.localhost>}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "require('net').createConnection({host:'redis',port:6379}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
    networks: [internal]

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      # Stays "development" on localhost so the AdminJS session cookie
      # isn't marked Secure (plain http://localhost otherwise drops it).
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bloomoulu}:${POSTGRES_PASSWORD:-bloomoulu}@postgres:5432/${POSTGRES_DB:-bloomoulu}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@admin.com}
      ADMIN_BOOTSTRAP_PASSWORD_HASH: ${ADMIN_BOOTSTRAP_PASSWORD_HASH}
    ports:
      - "${ADMIN_PORT:-4100}:4100"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/admin/health"]
    networks: [internal]

  kiosk:
    build:
      context: .
      dockerfile: infra/docker/kiosk.Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${KIOSK_PORT:-3100}:3100"
    networks: [internal]

  # ── Data plane ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bloomoulu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloomoulu}
      POSTGRES_DB:       ${POSTGRES_DB:-bloomoulu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks: [internal]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    networks: [internal]

  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    networks: [internal]

  # ── ML / embeddings ────────────────────────────────────────────────────
  # The Ollama LLM lives on the macOS host (for Metal GPU). The reranker
  # runs in-cluster because BAAI/bge-reranker-v2-m3 is CPU-friendly.
  reranker:
    build:
      context: .
      dockerfile: infra/docker/reranker.Dockerfile
    <<: *restart
    environment:
      MODEL_ID: BAAI/bge-reranker-v2-m3
      MAX_LEN: "512"
      LOG_LEVEL: INFO
    volumes:
      - reranker_data:/data
    ports:
      - "${RERANKER_PORT:-8081}:8080"
    networks: [internal]

  # ── Email (dev capture-all; real SMTP via .env variables) ──────────────
  mailhog:
    image: mailhog/mailhog
    <<: *restart
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks: [internal]

  # ── Observability (LGTM stack, minimal) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [alertmanager]
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:latest
    <<: *restart
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.localhost.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      mailhog: { condition: service_started }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy | grep -q OK"]
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-bloomoulu}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [internal]

  loki:
    image: grafana/loki:latest
    <<: *restart
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:latest
    <<: *restart
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    networks: [internal]

  tempo:
    image: grafana/tempo:2.7.2
    <<: *restart
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3200/ready | grep -q ready"]
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  reranker_data: {}
  alertmanager_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
