<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BloomOulu · University of Oulu Botanical Garden</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png" />
<meta name="theme-color" content="#1F3C2D" />
<meta name="description" content="Unified digital platform for the University of Oulu Botanical Garden: tiered plant adoption, AI-grounded plant guide, immersive QR experience, and lobby kiosk. Multilingual EN/FI/SV." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<!-- Leaflet (free OpenStreetMap-based mapping) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

<!-- QR code generator (vanilla JS, no deps) -->
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    /* Derived from BloomOulu logo + pitch deck */
    --ink: #18271E;
    --ink-soft: #2C3E33;
    --ink-mute: #5C6E60;
    --forest-deep: #1F3C2D;
    --forest: #2D5440;
    --forest-mid: #3D6A52;
    --sage: #88A050;
    --sage-bright: #A8C060;
    --sage-pale: #E8EEDE;
    --teal: #5FB0A0;
    --teal-soft: #95C8B8;
    --teal-pale: #D6EBE3;
    --amber: #C9A14A;
    --amber-soft: #F1E6CB;
    --rust: #B25C3A;
    --rust-soft: #F0DCD0;
    --cream: #FAF7EE;
    --cream-deep: #F2EDE0;
    --paper: #FFFFFF;
    --line: rgba(24, 39, 30, 0.10);
    --line-strong: rgba(24, 39, 30, 0.22);
    --shadow-soft: 0 1px 3px rgba(24,39,30,.06), 0 8px 24px rgba(24,39,30,.04);
    --shadow-mid:  0 4px 16px rgba(24,39,30,.08), 0 16px 48px rgba(24,39,30,.08);
    --shadow-deep: 0 8px 32px rgba(24,39,30,.14), 0 32px 80px rgba(24,39,30,.10);

    --f-display: "Fraunces", "Georgia", serif;
    --f-body: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    --f-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;

    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 12px;
    --radius-xl: 20px;

    /* Aliases to keep older screen code working */
    --bg: var(--cream);
    --ink-2: var(--ink-soft);
    --ink-3: var(--ink-mute);
    --line-soft: var(--line);
    --moss: var(--forest-mid);
    --lichen: var(--sage-bright);
    --bloom: var(--amber);
    --sky: var(--teal);
    --berry: var(--rust);
    --gold: var(--amber);

    /* Logo gradient */
    --grad-logo: linear-gradient(135deg, var(--forest) 0%, var(--teal) 50%, var(--sage-bright) 100%);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--f-body);
    font-weight: 400;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .serif { font-family: var(--f-display); font-weight: 400; letter-spacing: -0.01em; font-variation-settings: "opsz" 48, "SOFT" 25; }
  .mono { font-family: var(--f-mono); font-feature-settings: "tnum" 1; }
  .italic-serif { font-family: var(--f-display); font-style: italic; font-weight: 400; }

  h1, h2, h3, h4 {
    font-family: var(--f-display);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.0;
    margin: 0;
    color: var(--ink);
    font-variation-settings: "opsz" 96, "SOFT" 25;
  }
  p { margin: 0; }

  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
  input, textarea, select { font-family: inherit; }

  /* Eyebrow / kicker */
  .eyebrow {
    font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .24em; color: var(--forest);
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .eyebrow::before {
    content: ""; display: inline-block; width: 24px; height: 1px;
    background: var(--forest);
  }
  .eyebrow.eyebrow--rust { color: var(--rust); }
  .eyebrow.eyebrow--rust::before { background: var(--rust); }
  .eyebrow.eyebrow--sage { color: var(--sage-bright); }
  .eyebrow.eyebrow--sage::before { background: var(--sage-bright); }

  /* Accent gradients (matching pitch) */
  .accent-grad {
    background: linear-gradient(120deg, var(--forest) 0%, var(--sage) 55%, var(--teal) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .accent-sage {
    background: linear-gradient(120deg, var(--sage) 0%, var(--forest) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ------- App chrome ------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250, 247, 238, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--f-display);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--forest-deep);
    cursor: pointer;
    font-variation-settings: "opsz" 36, "SOFT" 20;
  }
  .brand-mark {
    width: 34px; height: 34px;
    flex-shrink: 0;
  }

  .nav {
    display: flex; gap: 4px;
    margin-left: 20px;
  }
  .nav button {
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
    transition: all 120ms;
    display: flex; align-items: center; gap: 6px;
  }
  .nav button:hover { background: rgba(45, 84, 64, 0.07); color: var(--forest-deep); }
  .nav button.active {
    background: var(--forest-deep);
    color: var(--cream);
  }

  .topbar-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 12px;
  }
  .lang-pill {
    display: flex; gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(45, 84, 64, 0.08);
    font-size: 11px;
    font-weight: 500;
    font-family: var(--f-mono);
  }
  .lang-pill button {
    padding: 4px 9px;
    border-radius: 999px;
    color: var(--ink-mute);
  }
  .lang-pill button.active {
    background: var(--cream);
    color: var(--forest-deep);
    box-shadow: var(--shadow-soft);
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    background: var(--paper);
    transition: all 120ms;
  }
  .icon-btn:hover { background: var(--forest-deep); color: var(--cream); border-color: var(--forest-deep); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--f-mono);
    white-space: nowrap;
  }
  .badge-cr { background: var(--rust-soft); color: var(--rust); }
  .badge-en { background: var(--rust-soft); color: var(--rust); }
  .badge-vu { background: var(--amber-soft); color: #876422; }
  .badge-nt { background: var(--sage-pale); color: var(--forest); }
  .badge-lc { background: var(--teal-pale); color: var(--forest-mid); }
  .badge-na { background: var(--cream-deep); color: var(--ink-mute); }

  .container { max-width: 1320px; margin: 0 auto; padding: 32px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(45, 84, 64, 0.07);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 500;
  }
  .pill-on-dark { background: rgba(250, 247, 238, 0.12); color: var(--cream); border: 1px solid rgba(250,247,238,0.18); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    transition: all 140ms;
    border: 1px solid transparent;
    font-family: var(--f-body);
  }
  .btn-primary { background: var(--forest-deep); color: var(--cream); }
  .btn-primary:hover { background: #142B20; transform: translateY(-1px); box-shadow: var(--shadow-mid); }
  .btn-secondary { background: var(--paper); color: var(--ink); border-color: var(--line-strong); }
  .btn-secondary:hover { border-color: var(--forest); }
  .btn-rust { background: var(--rust); color: var(--cream); }
  .btn-rust:hover { background: #934727; }
  .btn-grad { background: var(--grad-logo); color: var(--cream); }
  .btn-grad:hover { transform: translateY(-1px); box-shadow: var(--shadow-mid); }
  .btn-ghost { color: var(--ink-soft); }
  .btn-ghost:hover { background: rgba(45, 84, 64, 0.07); }
  .btn-block { width: 100%; }
  .btn-lg { padding: 16px 26px; font-size: 15px; }

  .card {
    background: var(--paper);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-soft);
  }
  .card-pad { padding: 24px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(45, 84, 64, 0.22); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Utility */
  .row { display: flex; gap: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .between { justify-content: space-between; }
  .center { align-items: center; }
  .muted { color: var(--ink-mute); }
  .small { font-size: 13px; }
  .tiny {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    font-family: var(--f-mono); color: var(--ink-mute); font-weight: 500;
  }
  .label {
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    font-family: var(--f-mono); color: var(--ink-mute); font-weight: 500;
  }

  .fade-in { animation: fadeIn 280ms ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Reusable veining decoration */
  .veining {
    background-image: repeating-linear-gradient(115deg, transparent, transparent 80px, rgba(168,192,96,.04) 80px, rgba(168,192,96,.04) 81px);
  }

  /* ===================================================================
     ACCESSIBILITY - WCAG 2.2 AA / European Accessibility Act 2025
     =================================================================== */

  /* Screen-reader-only utility (visible to AT, hidden from sighted users) */
  .sr-only {
    position: absolute !important;
    width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important;
    overflow: hidden !important; clip: rect(0,0,0,0) !important;
    white-space: nowrap !important; border: 0 !important;
  }

  /* Skip-to-content link: hidden until keyboard-focused */
  .skip-link {
    position: absolute; top: -100px; left: 0;
    background: var(--forest-deep); color: var(--cream);
    padding: 12px 20px;
    font-family: var(--f-body); font-weight: 600; font-size: 14px;
    z-index: 1000; border-radius: 0 0 8px 0;
    transition: top 0.15s;
  }
  .skip-link:focus { top: 0; outline: 3px solid var(--sage-bright); }

  /* Visible focus indicator for keyboard nav (WCAG 2.4.7) */
  *:focus { outline: none; }
  *:focus-visible {
    outline: 3px solid var(--sage-bright);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .btn:focus-visible, .icon-btn:focus-visible, button:focus-visible {
    outline: 3px solid var(--sage-bright);
    outline-offset: 3px;
  }

  /* Respect user's reduced-motion preference (WCAG 2.3.3) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .fade-in { animation: none !important; }
  }
  body.bloom-reduced-motion *,
  body.bloom-reduced-motion *::before,
  body.bloom-reduced-motion *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  body.bloom-reduced-motion .fade-in { animation: none !important; }

  /* Larger text mode (~120% root) */
  body.bloom-larger-text { font-size: 17px; }
  body.bloom-larger-text h1 { font-size: 110% !important; }
  body.bloom-larger-text h2 { font-size: 110% !important; }
  body.bloom-larger-text h3 { font-size: 110% !important; }
  body.bloom-larger-text .small,
  body.bloom-larger-text .tiny { font-size: 14px !important; }

  /* High-contrast mode: darker ink, stronger borders, no transparency */
  body.bloom-high-contrast {
    --ink: #000000;
    --ink-soft: #111111;
    --ink-mute: #2A2A2A;
    --line: rgba(0,0,0,0.45);
    --line-strong: rgba(0,0,0,0.8);
    --paper: #FFFFFF;
    --cream: #FFFFFF;
    --cream-deep: #F5F5F5;
  }
  body.bloom-high-contrast .muted { color: #2A2A2A !important; }
  body.bloom-high-contrast a { text-decoration: underline; }
  body.bloom-high-contrast .btn-primary { background: #0A1A12 !important; }
  body.bloom-high-contrast .icon-btn,
  body.bloom-high-contrast .pill,
  body.bloom-high-contrast .card { border: 1.5px solid #000 !important; }

  /* Accessibility settings floating button */
  .a11y-fab {
    position: fixed; bottom: 24px; left: 24px; z-index: 90;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--forest-deep); color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    border: 0; cursor: pointer;
    box-shadow: var(--shadow-deep);
  }
  .a11y-fab:hover { background: #142B20; }
  @media (max-width: 768px) {
    .a11y-fab { bottom: 78px; left: 16px; width: 44px; height: 44px; }
  }
  .a11y-panel {
    position: fixed; bottom: 84px; left: 24px; z-index: 91;
    width: 300px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-deep);
    padding: 18px 20px;
  }
  @media (max-width: 768px) {
    .a11y-panel { bottom: 130px; left: 16px; width: calc(100vw - 32px); max-width: 320px; }
  }
  .a11y-panel h2 {
    font-family: var(--f-display); font-size: 18px;
    font-weight: 500; margin: 0 0 12px;
  }
  .a11y-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .a11y-row:first-of-type { border-top: 0; }
  .a11y-row label { font-size: 14px; cursor: pointer; flex: 1; }
  .a11y-row input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer;
    accent-color: var(--forest);
  }

  /* Toast notifications (live region) */
  .bloom-toaster {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
    max-width: calc(100vw - 32px);
  }
  @media (max-width: 768px) {
    .bloom-toaster { bottom: 76px; }
  }
  .bloom-toast {
    background: var(--forest-deep); color: var(--cream);
    padding: 12px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-deep);
    display: flex; align-items: center; gap: 10px;
    animation: bloom-toast-in 0.2s ease-out, bloom-toast-out 0.2s ease-in 2.6s forwards;
    pointer-events: auto;
  }
  @keyframes bloom-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bloom-toast-out { to { opacity: 0; transform: translateY(8px); } }
  body.bloom-reduced-motion .bloom-toast { animation: none; }

  /* ===================================================================
     MOBILE TAB BAR - visible only at <=768px (defined inside @media)
     =================================================================== */
  .mobile-tabs { display: none; }

  /* ===================================================================
     RESPONSIVE - phone & small tablet (<=768px)
     Uses !important to override inline grid/width/sticky styles.
     =================================================================== */
  @media (max-width: 768px) {
    html, body { font-size: 14px; }
    body { padding-bottom: 64px; }

    /* Container: tighter padding, full width */
    .container { padding: 20px 16px !important; max-width: 100% !important; }

    /* Heading sizes - fluid scaling */
    h1 { font-size: clamp(30px, 8vw, 44px) !important; line-height: 1.05 !important; }
    h2 { font-size: clamp(24px, 6.5vw, 34px) !important; line-height: 1.1 !important; }
    h3 { font-size: clamp(20px, 5.5vw, 28px) !important; line-height: 1.15 !important; }

    /* Top bar: hide desktop nav (replaced by bottom tabs), shrink chrome */
    .topbar-inner { padding: 10px 14px !important; gap: 10px !important; }
    .nav { display: none !important; }
    .brand { font-size: 18px !important; }
    .brand-mark { width: 28px !important; height: 28px !important; }
    .topbar-right { gap: 6px !important; margin-left: auto !important; }
    .lang-pill { font-size: 10px !important; }
    .lang-pill button { padding: 3px 7px !important; }
    .icon-btn { width: 34px !important; height: 34px !important; }

    /* All inline grids collapse to single column.
       React renders camelCase style props as kebab-case in the DOM,
       so the attribute selector must match the kebab-case form. */
    [style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
      gap: 16px !important;
    }
    [data-grid-mobile="2"] { grid-template-columns: 1fr 1fr !important; }
    [data-grid-mobile="keep"] { /* preserve original grid */ }

    /* Side sticky panels (top: 140) become inline on mobile; top bars stay sticky */
    [style*="position: sticky"][style*="top: 140"] {
      position: static !important;
      top: auto !important;
    }

    /* 100vh containers become natural-height */
    [style*="100vh - 65px"], [style*="100vh-65px"] {
      height: auto !important;
      min-height: auto !important;
      overflow: visible !important;
    }

    /* Fixed-width side panels become full-width */
    [style*="width: 280px"], [style*="width: 300px"], [style*="width: 320px"],
    [style*="width: 360px"], [style*="width: 380px"], [style*="width: 460px"],
    [style*="width: 480px"], [style*="width: 520px"], [style*="width: 540px"],
    [style*="width: 560px"], [style*="width: 600px"], [style*="width: 760px"],
    [style*="max-width: 320"], [style*="max-width: 460"], [style*="max-width: 480"],
    [style*="max-width: 520"], [style*="max-width: 540"], [style*="max-width: 560"],
    [style*="max-width: 600"], [style*="max-width: 760"], [style*="max-width: 800"] {
      width: 100% !important;
      max-width: 100% !important;
    }
    [style*="min-width: 180"] { min-width: 0 !important; }

    /* Tables: tighter */
    table td { padding: 8px 0 !important; font-size: 12px !important; }
    table td:first-child { width: 45% !important; }

    /* Buttons: tappable */
    .btn { min-height: 44px; padding: 12px 16px !important; }
    .btn-lg { padding: 14px 20px !important; font-size: 14px !important; }
    .btn-block { width: 100% !important; }
    .icon-btn { min-width: 38px; min-height: 38px; }

    /* Disable heavy decoration on small screens */
    .veining { background-image: none !important; }

    /* Footer copyright row stacks */
    footer .container[style*="space-between"]:last-child {
      flex-wrap: wrap !important; gap: 8px !important;
      flex-direction: column !important; align-items: flex-start !important;
    }

    /* Bottom tab bar */
    .mobile-tabs {
      display: flex;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(250, 247, 238, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      z-index: 100;
      padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .mobile-tabs button {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      padding: 4px 2px;
      color: var(--ink-mute);
      font-size: 9.5px;
      font-weight: 500;
      background: transparent;
      border: 0;
      letter-spacing: 0.02em;
    }
    .mobile-tabs button.active { color: var(--forest-deep); }
    .mobile-tabs button.active svg { stroke: var(--forest-deep); }

    /* Reduce big hero stats strip gap */
    section [style*="grid-template-columns: repeat(4, 1fr)"] { gap: 12px !important; }
